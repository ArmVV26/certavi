name: E2E

# End-to-end tests, only on pull requests to main (releases): they are the slow part. PRs to dev
# run the checks of ci.yml. They are their own workflow, not jobs with an `if` inside ci.yml, so a
# PR to dev does not list them as "skipped" checks (the matrix job even showed its raw
# `${{ matrix.project }}` template as its name).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Builds the app for the e2e tests once (`--mode e2e` keeps the /dev/ui catalog) and shares it
  # with every e2e job, instead of each of the five building it again.
  build-e2e:
    name: Build for end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the e2e bundle
        run: npx vite build --mode e2e --outDir dist-e2e

      - name: Upload the e2e bundle
        uses: actions/upload-artifact@v7
        with:
          name: dist-e2e
          path: dist-e2e/
          retention-days: 1

  e2e:
    name: End-to-end (${{ matrix.project }} ${{ matrix.shard }})
    needs: build-e2e
    runs-on: ubuntu-latest
    # The five jobs run in parallel. Install takes ~2-4 min. WebKit tests add up to ~19 min on one
    # worker (measured with `npm run e2e:timings`), so they are split in three shards of ~7 min;
    # with two shards, the jobs hit the old 15 min limit (PR to main, 2026-11-11). 25 min leaves
    # room for a slow runner and a retry; it still catches a hang.
    timeout-minutes: 25
    strategy:
      # A failure in one browser must not hide the result of the others.
      fail-fast: false
      matrix:
        include:
          # Chromium runs every test; WebKit only the ones tagged @all-engines (see
          # playwright.config.ts). WebKit is the slow one (one worker on a 2-vCPU runner): three
          # shards for it, two for Chromium.
          - project: chromium
            shard: 1/2
          - project: chromium
            shard: 2/2
          - project: webkit
            shard: 1/3
          - project: webkit
            shard: 2/3
          - project: webkit
            shard: 3/3
    env:
      # playwright.config.ts then only serves the downloaded bundle (no second build).
      E2E_PREBUILT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the e2e bundle
        uses: actions/download-artifact@v8
        with:
          name: dist-e2e
          path: dist-e2e

      # Each job installs only its own browser, cached per Playwright version (pinned exact in
      # package.json), so a new version downloads it once. System libraries are not cached:
      # install-deps adds them.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.project }}

      - name: Install the Playwright browser and its system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Install the system libraries of the cached browser
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.project }}

      # playwright.config.ts records a trace on the first retry (CI retries once).
      # --project and --shard are used only here, never locally.
      - name: End-to-end tests
        run: npm run e2e:all -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}

      # The HTML report embeds the traces and screenshots; test-results/ also keeps the raw
      # trace.zip and error-context.md of every failed test.
      - name: Set the report artifact name
        if: always()
        run: echo "shard_name=$(echo '${{ matrix.shard }}' | tr '/' '-')" >> "$GITHUB_ENV"

      # The time of every test, always (not only on failure): download the five artifacts and run
      # `npm run e2e:timings -- <the .json files>` to see which tests drift towards the limit.
      - name: Upload the time of every test
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-timings-${{ matrix.project }}-${{ env.shard_name }}
          path: e2e-timings/last-run.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}-${{ env.shard_name }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
