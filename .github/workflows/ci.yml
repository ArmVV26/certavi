name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Unused files, exports and dependencies (knip.json).
      - name: Unused code
        run: npm run knip

      # Known vulnerabilities (high or critical) in the runtime dependencies that ship to users.
      # Dev-only packages are skipped: they never reach the browser or the function.
      - name: Audit runtime dependencies
        run: npm audit --audit-level=high --omit=dev

      # Runs every unit and component test once, and fails if src/domain coverage drops below
      # 90 % (thresholds in vite.config.ts).
      - name: Unit and component tests, with domain coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  # Builds the app for the e2e tests once (`--mode e2e` keeps the /dev/ui catalog) and shares it
  # with every e2e job, instead of each of the four building it again.
  build-e2e:
    name: Build for end-to-end
    # Only on PRs to main (releases), like the e2e job.
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the e2e bundle
        run: npx vite build --mode e2e --outDir dist-e2e

      - name: Upload the e2e bundle
        uses: actions/upload-artifact@v7
        with:
          name: dist-e2e
          path: dist-e2e/
          retention-days: 1

  e2e:
    name: End-to-end (${{ matrix.project }} ${{ matrix.shard }})
    # Only on PRs to main (releases): it is the slow job. PRs to dev run the checks above.
    if: github.base_ref == 'main'
    needs: build-e2e
    runs-on: ubuntu-latest
    # The four jobs run in parallel. Install takes ~2 min and each shard well under 8 min (the
    # suite's own cap is 20 min, `e2e:all`); this only catches a hang.
    timeout-minutes: 15
    strategy:
      # A failure in one browser must not hide the result of the others.
      fail-fast: false
      matrix:
        include:
          # Chromium runs every test; WebKit only the ones tagged @all-engines (see
          # playwright.config.ts). Two shards each keep every job short on a 2-vCPU runner
          # (one worker).
          - project: chromium
            shard: 1/2
          - project: chromium
            shard: 2/2
          - project: webkit
            shard: 1/2
          - project: webkit
            shard: 2/2
    env:
      # playwright.config.ts then only serves the downloaded bundle (no second build).
      E2E_PREBUILT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the e2e bundle
        uses: actions/download-artifact@v8
        with:
          name: dist-e2e
          path: dist-e2e

      # Each job installs only its own browser, cached per Playwright version (pinned exact in
      # package.json), so a new version downloads it once. System libraries are not cached:
      # install-deps adds them.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ matrix.project }}

      - name: Install the Playwright browser and its system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Install the system libraries of the cached browser
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.project }}

      # playwright.config.ts records a trace on the first retry (CI retries once).
      # --project and --shard are used only here, never locally.
      - name: End-to-end tests
        run: npm run e2e:all -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}

      # The HTML report embeds the traces and screenshots; test-results/ also keeps the raw
      # trace.zip and error-context.md of every failed test.
      - name: Set the report artifact name
        if: always()
        run: echo "shard_name=$(echo '${{ matrix.shard }}' | tr '/' '-')" >> "$GITHUB_ENV"

      # The time of every test, always (not only on failure): download the four artifacts and run
      # `npm run e2e:timings -- <the .json files>` to see which tests drift towards the limit.
      - name: Upload the time of every test
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-timings-${{ matrix.project }}-${{ env.shard_name }}
          path: e2e-timings/last-run.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}-${{ env.shard_name }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
