name: CI

# Quick checks on every pull request to dev or main. The slow end-to-end tests are in e2e.yml and
# only run on pull requests to main.
on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Unused files, exports and dependencies (knip.json).
      - name: Unused code
        run: npm run knip

      # Known vulnerabilities (high or critical) in the runtime dependencies that ship to users.
      # Dev-only packages are skipped: they never reach the browser or the function.
      - name: Audit runtime dependencies
        run: npm audit --audit-level=high --omit=dev

      # Runs every unit and component test once, and fails if src/domain coverage drops below
      # 90 % (thresholds in vite.config.ts).
      - name: Unit and component tests, with domain coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
