name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Runs every unit and component test once, and fails if src/domain coverage drops below
      # 90 % (thresholds in vite.config.ts).
      - name: Unit and component tests, with domain coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Chromium + WebKit)
    # Only on PRs to main (releases): it is the slow job. PRs to dev run the checks above.
    if: github.base_ref == 'main'
    needs: checks
    runs-on: ubuntu-latest
    # Target: under 5 min. The suite's own cap is 10 min (`e2e:all`); this only catches a hang.
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Browsers are cached per Playwright version (pinned exact in package.json), so a new
      # version downloads them once. System libraries are not cached: install-deps adds them.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers and their system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install the system libraries of the cached browsers
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      # playwright.config.ts records a trace on the first retry (CI retries twice).
      - name: End-to-end tests
        run: npm run e2e:all

      # The HTML report embeds the traces and screenshots; test-results/ also keeps the raw
      # trace.zip and error-context.md of every failed test.
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
