<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Browser UI colour = --bg. src/theme/theme.ts sets both to the active theme at startup. -->
    <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)" />
    <!-- Icons. The PNGs and favicon.ico are generated by `npm run icons` from public/icon.svg (a
         square, opaque tile: iOS and the PWA need that). The browser tab uses public/favicon.svg
         (round); modern browsers prefer it over the .ico. The manifest link is injected by
         vite-plugin-pwa at build time. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- Home-screen app on iOS: no Safari bars. `default` keeps the status bar opaque and legible
         in light and dark; `black-translucent` would draw white text over the light background. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Certavi" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Certavi</title>
    <!-- Theme and no-colour mode on <html> before the first paint (see public/theme-init.js). -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
